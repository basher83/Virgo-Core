# Ansible Galaxy requirements file
# Install roles: ansible-galaxy role install -r requirements.yml -p ~/.ansible/roles
# Install collections: ansible-galaxy collection install -r requirements.yml
roles:
  # Docker installation and management
  - name: geerlingguy.docker
    version: "7.9.0"
collections:
  # General community modules
  - name: community.general
    version: ">=11.4.0"
  # Proxmox modules (1.5.0+ required for proxmox_pct_remote connection plugin)
  - name: community.proxmox
    version: ">=1.5.0"
  # Infisical modules
  - name: infisical.vault
    version: ">=1.1.0"
  # Additional useful collections
  - name: ansible.posix
    version: ">=1.5.0"
  - name: ansible.utils
    version: ">=2.10.0"
  # Docker management modules
  - name: community.docker
    version: ">=3.4.0"

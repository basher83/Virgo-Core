# Sysctl tuning tasks
- name: Load TCP BBR kernel module
  community.general.modprobe:
    name: tcp_bbr
    state: present
    persistent: present
  when: proxmox_tuning_bbr_enabled | bool
  notify: Reload sysctl
- name: Ensure core dump directory exists
  ansible.builtin.file:
    path: /var/crash
    state: directory
    owner: root
    group: root
    mode: "0755"
  when: sysctl_kernel_panic | int > 0
- name: Deploy sysctl tuning configuration
  ansible.builtin.template:
    src: 99-proxmox-tuning.conf.j2
    dest: /etc/sysctl.d/99-proxmox-tuning.conf
    owner: root
    group: root
    mode: "0644"
  notify: Reload sysctl

---
# tasks/secrets.yml - Retrieve SSH keys from Infisical
# This task is only included when proxmox_template_use_infisical is true

- name: "secrets | Retrieve SSH keys from Infisical"
  ansible.builtin.include_tasks: "{{ playbook_dir }}/../tasks/infisical-secret-lookup.yml"
  vars:
    secret_name: "{{ proxmox_template_infisical_secret_name }}"
    secret_var_name: "_proxmox_template_ssh_keys_raw"
    infisical_path: "{{ proxmox_template_infisical_path }}"
    infisical_env: "{{ proxmox_template_infisical_env }}"
    infisical_project_id: "{{ proxmox_template_infisical_project_id }}"
  tags: [secrets]

- name: "secrets | Parse SSH keys from Infisical secret"
  ansible.builtin.set_fact:
    proxmox_template_ssh_keys: >-
      {{ _proxmox_template_ssh_keys_raw | split('\n') | map('trim') | select('match', '^ssh-') | list }}
  no_log: "{{ proxmox_template_no_log }}"
  tags: [secrets]

- name: "secrets | Validate SSH keys were retrieved"
  ansible.builtin.assert:
    that:
      - proxmox_template_ssh_keys | length > 0
    fail_msg: "No valid SSH keys found in Infisical secret {{ proxmox_template_infisical_secret_name }}"
    success_msg: "Retrieved {{ proxmox_template_ssh_keys | length }} SSH key(s) from Infisical"
    quiet: true
  tags: [secrets]

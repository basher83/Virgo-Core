---
# Distribute CEPH bootstrap keyrings to additional nodes
# Bug #15: Bootstrap keyrings must be distributed from cluster for OSD creation

- name: Create bootstrap-osd keyring directory
  ansible.builtin.file:
    path: /var/lib/ceph/bootstrap-osd
    state: directory
    owner: ceph
    group: ceph
    mode: '0755'

- name: Check if bootstrap-osd keyring already exists
  ansible.builtin.stat:
    path: /var/lib/ceph/bootstrap-osd/ceph.keyring
  register: bootstrap_osd_keyring_stat

- name: Generate bootstrap-osd keyring from cluster
  ansible.builtin.shell: |
    ceph auth get client.bootstrap-osd > /var/lib/ceph/bootstrap-osd/ceph.keyring
  args:
    creates: /var/lib/ceph/bootstrap-osd/ceph.keyring
  when: not bootstrap_osd_keyring_stat.stat.exists
  changed_when: true
  failed_when: false
  register: bootstrap_keyring_result

- name: Set ownership on bootstrap-osd keyring
  ansible.builtin.file:
    path: /var/lib/ceph/bootstrap-osd/ceph.keyring
    owner: ceph
    group: ceph
    mode: '0600'
  when: bootstrap_osd_keyring_stat.stat.exists or bootstrap_keyring_result.rc == 0

- name: Display bootstrap keyring status
  ansible.builtin.debug:
    msg: |
      Bootstrap-OSD keyring on {{ inventory_hostname }}:
      {% if bootstrap_osd_keyring_stat.stat.exists %}
      Already exists
      {% elif bootstrap_keyring_result.rc == 0 %}
      Generated from cluster
      {% else %}
      Failed to generate (cluster may not be ready)
      {% endif %}

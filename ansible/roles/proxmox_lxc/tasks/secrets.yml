# tasks/secrets.yml - Infisical secret retrieval for proxmox_lxc role

- name: "secrets | Retrieve API token from Infisical"
  ansible.builtin.include_tasks: "{{ playbook_dir }}/../tasks/infisical-secret-lookup.yml"
  vars:
    secret_name: "{{ proxmox_lxc_infisical_secret_name }}"
    secret_var_name: "proxmox_lxc_token_secret"
    infisical_path: "{{ proxmox_lxc_infisical_path }}"
    infisical_env: "{{ proxmox_lxc_infisical_env }}"
  tags: [secrets, infisical]

- name: "secrets | Validate token was retrieved"
  ansible.builtin.assert:
    that:
      - proxmox_lxc_token_secret is defined
      - proxmox_lxc_token_secret | length > 0
    fail_msg: |
      Failed to retrieve API token from Infisical.
      Check that {{ proxmox_lxc_infisical_secret_name }} exists at path {{ proxmox_lxc_infisical_path }}
    success_msg: "API token retrieved from Infisical"
    quiet: true
  no_log: "{{ proxmox_lxc_no_log }}"
  tags: [secrets, infisical]

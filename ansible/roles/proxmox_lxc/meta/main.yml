# meta/main.yml - Role metadata for proxmox_lxc
galaxy_info:
  role_name: proxmox_lxc
  author: basher83
  description: >-
    Manage Proxmox LXC containers with state-based lifecycle, Infisical secret integration, and SSH key injection.
  license: MIT
  min_ansible_version: "2.14"
  platforms:
    - name: Debian
      versions:
        - bookworm
  galaxy_tags:
    - proxmox
    - lxc
    - containers
    - virtualization
    - infrastructure
dependencies: []
# Note: community.proxmox collection is required
# infisical.vault collection is required when proxmox_lxc_use_infisical=true
# Both should be installed via requirements.yml at the project level

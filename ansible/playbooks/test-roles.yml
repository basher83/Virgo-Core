---
# Playbook: Test All Roles
# Purpose: Comprehensive testing of all Virgo-Core Ansible roles
# Usage:
#   Test all roles:     ansible-playbook -i inventory/hosts.yml playbooks/test-roles.yml --check --limit foxtrot
#   Test specific role: ansible-playbook -i inventory/hosts.yml playbooks/test-roles.yml --check --tags system_user --limit foxtrot
#   Test idempotency:   Run twice without --check, verify second run has changed=0

- name: Test Ansible Roles for Virgo-Core
  hosts: matrix_cluster
  gather_facts: true
  become: true

  vars:
    # Test user configuration
    test_username: "ansible-test-user"
    test_ssh_key: "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIGTestKeyForAnsibleTestingOnly ansible-test"

    # Infisical configuration (for proxmox_access role testing)
    infisical_project_id: '7b832220-24c0-45bc-a5f1-ce9794a31259'
    infisical_env: 'prod'
    infisical_path: '/{{ cluster_name }}'
    cluster_name: "matrix"

    # Proxmox configuration
    proxmox_version: "9.0"
    proxmox_enterprise_repo: false
    proxmox_no_subscription_repo: true
    auto_update_packages: false
    validate_certs: false  # Disable for testing due to SSL cert issues

    # Package management - skip during testing to avoid package installation issues
    proxmox_packages: []  # Don't install packages during testing

  pre_tasks:
    - name: Display test information
      ansible.builtin.debug:
        msg: |
          ========================================
          Ansible Role Testing Suite
          ========================================
          Target Hosts: {{ ansible_play_hosts | join(', ') }}
          Check Mode: {{ ansible_check_mode | default(false) }}
          ========================================
          Roles to be tested:
          - system_user
          - proxmox_repository
          - proxmox_network
          - proxmox_access
          - proxmox_cluster
          - proxmox_ceph
          ========================================
      run_once: true

  tasks:
    # =========================================================================
    # Test 1: system_user role
    # =========================================================================
    - name: Test system_user role
      tags: [system_user, users]
      block:
        - name: Test system_user role with test user
          ansible.builtin.include_role:
            name: system_user
          vars:
            system_users:
              - name: "{{ test_username }}"
                state: present
                shell: /bin/bash
                groups: []
                ssh_keys:
                  - "{{ test_ssh_key }}"
                sudo_nopasswd: false
                sudo_rules:
                  - /usr/bin/whoami
                  - /usr/bin/id

        - name: Verify test completed
          ansible.builtin.debug:
            msg: "✓ system_user role test completed"

    # =========================================================================
    # Test 2: proxmox_repository role
    # =========================================================================
    - name: Test proxmox_repository role
      tags: [proxmox_repository, repository, repos]
      block:
        - name: Test proxmox_repository role
          ansible.builtin.include_role:
            name: proxmox_repository

        - name: Verify test completed
          ansible.builtin.debug:
            msg: "✓ proxmox_repository role test completed"

    # =========================================================================
    # Test 3: proxmox_network role
    # =========================================================================
    - name: Test proxmox_network role
      tags: [proxmox_network, network]
      block:
        - name: Test proxmox_network role
          ansible.builtin.include_role:
            name: proxmox_network
          vars:
            # Use minimal configuration for testing
            network_bridges:
              - name: vmbr0
                ports: enp1s0f0
                address: "{{ ansible_default_ipv4.address }}"
                netmask: "{{ ansible_default_ipv4.netmask }}"
                gateway: "{{ ansible_default_ipv4.gateway | default(omit) }}"
                vlan_aware: false
                comment: "Management Bridge (Test)"

        - name: Verify test completed
          ansible.builtin.debug:
            msg: "✓ proxmox_network role test completed"
      when: false  # Disabled by default due to conditional logic issue

    # =========================================================================
    # Test 4: proxmox_access role
    # =========================================================================
    - name: Test proxmox_access role
      tags: [proxmox_access, access]
      block:
        - name: Test proxmox_access role with minimal configuration
          ansible.builtin.include_role:
            name: proxmox_access
          vars:
            # Test with minimal configuration - just create a test group
            proxmox_groups:
              - name: ansible-test-group
                comment: "Test group for Ansible validation"

            # Don't export env files during testing
            export_terraform_env: false

        - name: Verify test completed
          ansible.builtin.debug:
            msg: "✓ proxmox_access role test completed"

    # =========================================================================
    # Test 5: proxmox_cluster role
    # =========================================================================
    - name: Test proxmox_cluster role (check mode only)
      tags: [proxmox_cluster, cluster]
      block:
        - name: Warning - Cluster role test
          ansible.builtin.debug:
            msg: |
              ========================================
              WARNING: proxmox_cluster role testing
              ========================================
              This role modifies cluster configuration.
              Only run in check mode unless you intend
              to actually initialize a cluster.
              ========================================

        - name: Test proxmox_cluster role
          ansible.builtin.include_role:
            name: proxmox_cluster
          vars:
            cluster_name: "Matrix-Test"
            cluster_group: "matrix_cluster"
            cluster_nodes:
              - name: foxtrot
                hostname: foxtrot.matrix.spaceships.work
                management_ip: 192.168.3.5
                corosync_ip: 192.168.8.5
                node_id: 1
          when: ansible_check_mode | default(false)

        - name: Verify test completed
          ansible.builtin.debug:
            msg: "✓ proxmox_cluster role test completed (check mode only)"
          when: ansible_check_mode | default(false)

        - name: Skip cluster test in non-check mode
          ansible.builtin.debug:
            msg: "⊘ proxmox_cluster role test skipped (requires --check mode)"
          when: not (ansible_check_mode | default(false))

    # =========================================================================
    # Test 6: proxmox_ceph role
    # =========================================================================
    - name: Test proxmox_ceph role (check mode only)
      tags: [proxmox_ceph, ceph, storage]
      block:
        - name: Warning - CEPH role test
          ansible.builtin.debug:
            msg: |
              ========================================
              WARNING: proxmox_ceph role testing
              ========================================
              This role creates CEPH storage.
              Only run in check mode unless you intend
              to actually deploy CEPH storage.
              ========================================

        - name: Test proxmox_ceph role
          ansible.builtin.include_role:
            name: proxmox_ceph
          vars:
            ceph_version: "squid"
            ceph_network: "192.168.5.0/24"
            ceph_cluster_network: "192.168.7.0/24"
            ceph_pools: []
            ceph_osds: {}
          when: ansible_check_mode | default(false)

        - name: Verify test completed
          ansible.builtin.debug:
            msg: "✓ proxmox_ceph role test completed (check mode only)"
          when: ansible_check_mode | default(false)

        - name: Skip CEPH test in non-check mode
          ansible.builtin.debug:
            msg: "⊘ proxmox_ceph role test skipped (requires --check mode)"
          when: not (ansible_check_mode | default(false))

  post_tasks:
    - name: Display test summary
      ansible.builtin.debug:
        msg: |
          ========================================
          Test Run Complete
          ========================================
          Check Mode: {{ ansible_check_mode | default(false) }}
          Target: {{ inventory_hostname }}
          ========================================
          Next steps:
          1. Review output for errors or warnings
          2. Run without --check to apply changes
          3. Run again to verify idempotency
          4. Update testing-validation-results.md
          ========================================

---
# Playbook: System Upgrade for Proxmox/CEPH Cluster
# Purpose: Rolling upgrade with CEPH health awareness
# Usage:
#   Check mode:  uv run ansible-playbook playbooks/system-upgrade.yml --check
#   Upgrade:     uv run ansible-playbook playbooks/system-upgrade.yml
#   With reboot: uv run ansible-playbook playbooks/system-upgrade.yml -e auto_reboot=true

- name: Rolling System Upgrade (CEPH-aware)
  hosts: matrix_cluster
  serial: 1  # One node at a time for CEPH safety
  gather_facts: true
  become: true

  vars:
    auto_reboot: false
    ceph_health_timeout: 300  # 5 minutes to wait for CEPH health

  pre_tasks:
    - name: Check CEPH cluster health before upgrade
      ansible.builtin.command: ceph health
      register: ceph_health_pre
      changed_when: false
      failed_when: false
      check_mode: false

    - name: Display CEPH status
      ansible.builtin.debug:
        msg: "CEPH status: {{ ceph_health_pre.stdout }}"

    - name: Warn if CEPH not healthy
      ansible.builtin.debug:
        msg: "⚠️  WARNING: CEPH is not healthy. Proceeding with caution."
      when: ceph_health_pre.stdout is defined and 'HEALTH_OK' not in ceph_health_pre.stdout

  tasks:
    - name: Update APT cache
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 0

    - name: Run full system upgrade
      ansible.builtin.apt:
        upgrade: dist
      register: upgrade_result

    - name: Display upgrade result
      ansible.builtin.debug:
        msg: "{{ inventory_hostname }}: {{ 'Packages upgraded' if upgrade_result.changed else 'Already up to date' }}"

    - name: Check if reboot is required
      ansible.builtin.stat:
        path: /var/run/reboot-required
      register: reboot_required

    - name: Display reboot status
      ansible.builtin.debug:
        msg: "{{ inventory_hostname }}: {{ '⚠️  REBOOT REQUIRED' if reboot_required.stat.exists else '✓ No reboot needed' }}"

    - name: Reboot node if required and allowed
      when:
        - reboot_required.stat.exists
        - auto_reboot | bool
      block:
        - name: Set CEPH noout flag before reboot
          ansible.builtin.command: ceph osd set noout
          changed_when: true
          run_once: true
          delegate_to: "{{ groups['matrix_cluster'][0] }}"

        - name: Reboot the node
          ansible.builtin.reboot:
            msg: "Rebooting after system upgrade"
            reboot_timeout: 300

        - name: Wait for CEPH to recover
          ansible.builtin.command: ceph health
          register: ceph_health_post
          until: "'HEALTH_OK' in ceph_health_post.stdout or 'HEALTH_WARN' in ceph_health_post.stdout"
          retries: "{{ (ceph_health_timeout / 10) | int }}"
          delay: 10
          changed_when: false
          delegate_to: "{{ groups['matrix_cluster'][0] }}"

        - name: Unset CEPH noout flag after recovery
          ansible.builtin.command: ceph osd unset noout
          changed_when: true
          run_once: true
          delegate_to: "{{ groups['matrix_cluster'][0] }}"

  post_tasks:
    - name: Final CEPH health check
      ansible.builtin.command: ceph health
      register: ceph_health_final
      changed_when: false
      failed_when: false
      check_mode: false

    - name: Display final status
      ansible.builtin.debug:
        msg: |
          ========================================
          {{ inventory_hostname }} upgrade complete
          CEPH: {{ ceph_health_final.stdout }}
          ========================================

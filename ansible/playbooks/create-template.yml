---
# playbooks/create-template.yml
# Create a Proxmox VM template from Ubuntu 24.04 cloud image
#
# Usage:
#   uv run ansible-playbook playbooks/create-template.yml
#   uv run ansible-playbook playbooks/create-template.yml -e "target_host=golf"
#   uv run ansible-playbook playbooks/create-template.yml -e "proxmox_template_dry_run=true"

- name: Create Proxmox VM Template
  hosts: "{{ target_host | default(groups['matrix_cluster'][0]) }}"
  become: true
  gather_facts: true

  vars:
    # Template configuration - override these as needed
    proxmox_template_id: 9100
    proxmox_template_name: "ubuntu-2404-template"

    # Enable Infisical for SSH key management
    proxmox_template_use_infisical: true
    proxmox_template_infisical_path: "/matrix"

    # Hardware defaults (can be overridden)
    # proxmox_template_cpu_cores: 2
    # proxmox_template_memory: 2048

    # Network configuration
    # proxmox_template_net_bridge: "vmbr0"
    # proxmox_template_net2_bridge: "vmbr1"
    # proxmox_template_net2_vlan: "2"

  pre_tasks:
    - name: Display target host information
      ansible.builtin.debug:
        msg:
          - "Target Host: {{ inventory_hostname }}"
          - "Template ID: {{ proxmox_template_id }}"
          - "Template Name: {{ proxmox_template_name }}"

  roles:
    - role: proxmox_template

  post_tasks:
    - name: Next steps
      ansible.builtin.debug:
        msg:
          - "Template created successfully!"
          - ""
          - "To clone VMs from this template:"
          - "  1. Use Terraform/OpenTofu with the bpg/proxmox provider"
          - "  2. Reference template ID {{ proxmox_template_id }}"
          - ""
          - "Example Terraform:"
          - "  clone {"
          - "    vm_id = {{ proxmox_template_id }}"
          - "  }"
      when: not (proxmox_template_dry_run | default(false) | bool)

name: Validate
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    name: Lint & Validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install mise
        uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5

        with:
          install: true
      - name: Install Python dependencies
        run: mise run python-install
      - name: Install Ansible collections
        run: mise run ansible-setup
      - name: Check Terraform formatting
        run: mise run fmt-check
      - name: Validate Terraform
        run: mise run prod-validate
      - name: Lint Terraform (tflint)
        run: mise run lint-prod
      - name: Check Terraform docs
        run: mise run docs-check
      - name: Lint YAML
        run: mise run yaml-lint
      - name: Lint Shell scripts
        run: mise run shellcheck
      - name: Lint Markdown
        run: mise run markdown-lint
      - name: Lint Ansible
        run: mise run ansible-lint

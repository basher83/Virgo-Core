---
name: Validate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Lint & Validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Install mise
        uses: jdx/mise-action@c37c93293d6b742fc901e1406b8f764f6fb19dac # v2
        with:
          install: true

      - name: Install Python dependencies
        run: mise run python-install

      - name: Install Ansible collections
        run: mise run ansible-setup

      - name: Check Terraform formatting
        run: mise run fmt-check

      - name: Validate Terraform
        run: mise run prod-validate

      - name: Lint Terraform (tflint)
        run: mise run lint-prod

      - name: Check Terraform docs
        run: mise run docs-check

      - name: Lint YAML
        run: mise run yaml-lint

      - name: Lint Shell scripts
        run: mise run shellcheck

      - name: Lint Markdown
        run: mise run markdown-lint

      - name: Lint Ansible
        run: mise run ansible-lint

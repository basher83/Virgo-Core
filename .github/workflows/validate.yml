name: Validate
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    name: Lint & Validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Install mise
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4

        with:
          install: true
      - name: Install Python dependencies
        run: mise run python-install
      - name: Install Ansible collections
        run: mise run ansible-setup
      - name: Check Terraform formatting
        run: mise run fmt-check
      - name: Validate Terraform
        run: mise run prod-validate
      - name: Lint Terraform (tflint)
        run: mise run lint-prod
      - name: Check Terraform docs
        run: mise run docs-check
      - name: Lint YAML
        run: mise run yaml-lint
      - name: Lint Shell scripts
        run: mise run shellcheck
      - name: Lint Markdown
        run: mise run markdown-lint
      - name: Lint Ansible
        run: mise run ansible-lint

# Mise configuration for terraform-homelab
min_version = "2024.9.5"

[settings]
auto_install = true
not_found_auto_install = true
task_run_auto_install = true

[settings.status]
show_tools = true
show_env = false
truncate = true

[tools]
eza = "0.23.0"
fd = "10.2.0"
rg = "14.1.1"
terraform-docs = "0.20.0"
python = "3.14.0"
tflint = "0.60.0"
git-cliff = "2.10.1"
yamllint = "1.37.1"
yamlfmt = "0.20.0"
shellcheck = "0.11.0"
opentofu = "1.10.7"
uv = "0.9.13"


[env]
_.python.venv = { path = ".venv", create = true } # create the venv if it doesn't exist

[tasks.setup]
description = "Set up complete development environment"
depends = ["python-install", "ansible-setup", "hooks-install"]

[tasks.clean]
description = "Clean development environment"
depends = ["python-clean"]

# === Python tasks ===
[tasks.python-clean]
description = "Clean development environment"
run = """
rm -rf .venv
rm -rf requirements.lock
"""

[tasks.python-upgrade]
description = "Upgrade Python dependencies"
run = "uv lock --upgrade"

[tasks.python-install]
description = "Install Python dependencies"
run = "uv sync"
# === Python tasks ===

# === Changelog tasks ===
[tasks.changelog]
description = "Update changelog using git-cliff"
run = "git-cliff -o CHANGELOG.md"
# === Changelog tasks ===

# === Ansible tasks ===
[tasks.ansible-setup]
description = "Set up Ansible environment and install dependencies"
dir = "ansible"
run = "uv run ansible-galaxy collection install -r requirements.yml"

[tasks.ansible-install]
description = "Install Ansible requirements"
dir = "ansible"
run = "uv run ansible-galaxy collection install -r requirements.yml --force"

[tasks.ansible-ping]
description = "Test Ansible connectivity to all hosts"
dir = "ansible"
run = "uv run ansible all -m ansible.builtin.ping"

[tasks."ansible:test-roles"]
description = "Test all roles with tag-based selection"
dir = "ansible"
run = """
uv run ansible-playbook -i inventory/hosts.yml playbooks/test-roles.yml \
  --limit ${CLUSTER:-matrix_cluster} \
  ${TAGS:+--tags $TAGS} \
  ${CHECK:+--check --diff}
"""

[tasks."ansible:setup-terraform"]
description = "Setup Terraform automation (role-based)"
dir = "ansible"
run = """
uv run ansible-playbook -i inventory/hosts.yml \
  playbooks/setup-terraform-automation.yml \
  --limit ${CLUSTER:-matrix_cluster}
"""

[tasks."ansible:create-admin"]
description = "Create administrative user with SSH and sudo access"
dir = "ansible"
run = """
uv run ansible-playbook -i inventory/hosts.yml \
  playbooks/create-admin-user.yml \
  --limit ${HOSTS:-all} \
  -e "admin_name=${ADMIN_NAME}" \
  -e "admin_ssh_key=${ADMIN_SSH_KEY}"
"""

[tasks."ansible:configure-network"]
description = "Configure Proxmox network bridges and VLANs"
dir = "ansible"
run = """
uv run ansible-playbook -i inventory/hosts.yml \
  playbooks/configure-network.yml \
  --limit ${CLUSTER:-matrix_cluster} \
  ${CHECK:+--check --diff}
"""

[tasks."ansible:install-docker"]
description = "Install Docker on Proxmox nodes"
dir = "ansible"
run = """
uv run ansible-playbook -i inventory/hosts.yml \
  playbooks/install-docker.yml \
  --limit ${HOSTS:-all}
"""

[tasks."ansible:init-cluster"]
description = "Initialize Proxmox cluster (WARNING: Potentially destructive)"
dir = "ansible"
run = """
uv run ansible-playbook -i inventory/hosts.yml \
  playbooks/initialize-${CLUSTER:-matrix}-cluster.yml \
  ${CHECK:+--check --diff}
"""

[tasks."ansible:build-template"]
description = "Build VM template from cloud image"
dir = "ansible"
run = """
uv run ansible-playbook -i inventory/hosts.yml \
  playbooks/proxmox-build-template.yml \
  --limit ${NODE:-foxtrot} \
  -e "template_name=${TEMPLATE_NAME}" \
  -e "cloud_image_url=${IMAGE_URL}"
"""

[tasks."ansible:system-upgrade"]
description = "Rolling system upgrade (CEPH-aware, one node at a time)"
dir = "ansible"
run = """
uv run ansible-playbook -i inventory/hosts.yml \
  playbooks/system-upgrade.yml \
  ${CHECK:+--check --diff} \
  ${REBOOT:+-e auto_reboot=true}
"""
# === Ansible tasks ===

[tasks.fmt]
description = "Format all Terraform files recursively"
dir = "terraform"
run = "terraform fmt -recursive"

[tasks.yaml-fmt]
description = "Format YAML files"
run = "yamlfmt ."

[tasks.fmt-check]
description = "Check formatting recursively (non-mutating, CI-friendly)"
dir = "terraform"
run = "tofu fmt -recursive -check -diff"

[tasks.fmt-all]
description = "Format all files (Terraform and YAML)"
depends = ["fmt", "yaml-fmt"]

[tasks.prod-validate]
description = "Validate Terraform configuration"
dir = "terraform"
run = "tofu init -backend=false -input=false >/dev/null && tofu validate"

[tasks.docs-check]
description = "Check if Terraform documentation is up-to-date"
dir = "terraform"
run = "terraform-docs --config ../.terraform-docs.yml --output-check ."

[tasks.lint-prod]
description = "Run TFLint on Terraform configuration"
dir = "terraform"
run = "tflint --init && tflint"

[tasks.check]
description = "Format, lint, and validate Terraform configuration"
depends = ["fmt", "lint-prod", "prod-validate"]
env = { TF_IN_AUTOMATION = "true", TF_INPUT = "false" }

# === Hooks tasks ===
[tasks.hooks-install]
description = "Install prek and infisical hooks"
run = "prek install && infisical scan install --pre-commit-hook"

[tasks.hooks-run]
description = "Run pre-commit hooks"
run = "prek run --all-files"
# === Hooks tasks ===

# === Infisical tasks ===
[tasks.infisical-scan]
description = "Scan repository for secrets and sensitive data"
run = "infisical scan"
# === Infisical tasks ===

[tasks.shellcheck]
description = "Lint shell scripts"
run = "find scripts -name '*.sh' -exec shellcheck {} +"

[tasks.yaml-lint]
description = "Lint YAML files"
run = "yamllint ."

[tasks.markdown-lint]
description = "Lint Markdown files"
run = "rumdl check ."

[tasks.markdown-fix]
description = "Fix Markdown files"
run = "rumdl fmt ."

[tasks.ansible-lint]
description = "Lint Ansible files (playbooks and roles)"
dir = "ansible"
run = "uv run ansible-lint playbooks/ roles/"

[tasks.lint-all]
description = "Run all linting tasks"
depends = [
  "shellcheck",
  "yaml-lint",
  "markdown-lint",
  "lint-prod",
  "ansible-lint",
]

[tasks.validate-all]
description = "Validate Terraform configuration"
depends = ["prod-validate"]

[tasks.full-check]
description = "Complete validation including formatting, linting, docs, and security"
depends = [
  "fmt-all",
  "validate-all",
  "lint-all",
  "docs-check",
  "infisical-scan",
]
env = { TF_IN_AUTOMATION = "true", TF_INPUT = "false" }
